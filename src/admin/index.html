<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Gestão de Conteúdo — GPTCLONE Blog</title>
    <!-- URL do ficheiro de configuração da CMS (mesma pasta: admin/config.yml) -->
    <link
      rel="cms-config-url"
      href="config.yml"
      type="text/yaml"
    />
  </head>
  <body>
    <!--
      Interface de administração do GPTCLONE Blog (Decap CMS).
      Este é um ficheiro estático: não contém credenciais nem tokens.
      A autenticação com o GitHub é feita através do servidor proxy definido
      em admin/config.yml (base_url / auth_endpoint). Veja cms-proxy/README.md
      e CONTENT-MANAGEMENT.md.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
